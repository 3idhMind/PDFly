    <!--
      Design-system fonts (DM Sans / Syne / Instrument Serif / JetBrains Mono)
      MUST be loaded here, not via @import in index.css. An @import placed after
      the @tailwind directives is invalid CSS and Vite silently strips it, which
      is why none of these fonts shipped to production. See _internal L-003.
    -->
    <!--
      FOUR families only, and that is a deliberate cap.

      This request previously loaded eleven — the four design faces plus Inter
      and six Noto families — which is 1,931 @font-face rules and 425,707 wire
      bytes of RENDER-BLOCKING CSS. For scale: that is eight times the size of
      scan4u.in's entire homepage document. PDFly serves its HTML in 0.19s, the
      fastest first byte in the category by 2.3x, and then threw all of it away
      waiting on this one request.

      The Noto families were only ever used to display native language names in
      the picker (हिन्दी, العربية); system fonts handle those on every platform
      that has the script installed, and a fallback glyph is a fair trade for
      424KB off the critical path. PDF generation does NOT depend on these —
      clientPdfGenerator.ts fetches its own TTFs on demand at render time.

      Before adding a family here, check what it costs. Four families = 977 bytes.
    -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
